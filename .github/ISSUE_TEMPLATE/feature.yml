name: "功能建议 / Feature request"
description: "建议 Railnest TV 的改进 / Suggest an improvement to Railnest TV"
body:
  - type: textarea
    id: use_case
    attributes:
      label: "你想在电视上完成什么？ / What would you like to do on your TV?"
    validations:
      required: true
  - type: textarea
    id: interaction
    attributes:
      label: "期望的交互 / Desired interaction"
      description: "可以描述如何使用遥控器完成该操作。 / Describe how you would use the remote to do it."
