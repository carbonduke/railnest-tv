name: "问题反馈 / Bug report"
description: "报告可重现的问题 / Report a reproducible problem"
body:
  - type: input
    id: environment
    attributes:
      label: "设备型号、系统版本和 Railnest TV 版本 / Device model, Android version, and Railnest TV version"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "复现步骤 / Steps to reproduce"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: "预期与实际结果 / Expected and actual behavior"
      description: "可附上截图或日志。请先去除账号、IP、Wi-Fi 名称和二维码。 / Attach screenshots or logs if helpful. Remove account details, IP addresses, Wi-Fi names, and QR codes."
    validations:
      required: true
