name: "机型兼容性 / Device compatibility"
description: "报告 Railnest TV 在一台设备上的实测结果 / Report how Railnest TV works on a specific device"
body:
  - type: input
    id: model
    attributes:
      label: "设备型号 / Device model"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Android 版本、固件和 ABI / Android version, firmware, and ABI"
  - type: textarea
    id: results
    attributes:
      label: "实测结果 / Test results"
      description: "注明 Railnest TV 版本和安装方式。可分别记录 Home 键、重启、待机唤醒和屏保。 / Include the launcher version and installation method. Note what happened with Home, reboot, wake, and the screensaver."
    validations:
      required: true
